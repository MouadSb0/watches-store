<style>
        /* Minimalist Input Styles overrides for Tailwind forms */
        input[type="email"],
        input[type="password"] {
            border: none;
            border-bottom: 1px solid #1a1c1c; /* on-surface */
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
            background-color: transparent;
        }
        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            box-shadow: none;
            border-bottom: 1px solid #775a19; /* secondary gold accent */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
    @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1.5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
    }
    @keyframes float-reverse {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(-1.5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
    }
    .floating-watch-1 {
        animation: float 12s ease-in-out infinite;
        mix-blend-mode: multiply;
        filter: contrast(1.1) grayscale(20%);
    }
    .floating-watch-2 {
        animation: float-reverse 14s ease-in-out infinite;
        mix-blend-mode: multiply;
        filter: contrast(1.1) grayscale(20%);
    }
    .floating-watch-3 {
        animation: float 16s ease-in-out infinite;
        mix-blend-mode: multiply;
        filter: contrast(1.1) grayscale(20%);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-md selection:bg-primary selection:text-on-primary">
<!-- Floating 3D Watches -->
<div class="fixed inset-0 overflow-hidden pointer-events-none z-[0]">
    <img src="imgs/img_3d1.jpeg" class="absolute top-[5%] right-[10%] w-32 md:w-48 floating-watch-1 opacity-[0.25]" alt="3D Watch Background">
    <img src="imgs/img_3d2.png" class="absolute bottom-[5%] right-[2%] w-40 md:w-56 floating-watch-2 opacity-[0.25]" alt="3D Watch Background">
    <img src="imgs/img_3d.png" class="absolute top-[45%] right-[18%] w-24 md:w-36 floating-watch-3 opacity-[0.15]" alt="3D Watch Background">
</div>
<main class="w-full max-w-[480px] px-margin-mobile md:px-0 relative z-10">
<!-- Header Section -->
<div class="text-center mb-16">
<img src="imgs/logo_bg.jpg" alt="Axios Logo with bg" class="h-36 mx-auto mb-10">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface">Welcome Back</h2>
</div>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-8 w-full" method="POST">
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="email">Email Address</label>
<input class="w-full font-body-lg text-body-lg text-on-surface py-2" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center w-full">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase" for="password">Password</label>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-primary transition-colors uppercase underline underline-offset-4" href="forgot_pass.html">Forgot Password?</a>
</div>
<input class="w-full font-body-lg text-body-lg text-on-surface py-2" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<button class="w-full bg-primary text-on-primary font-label-caps text-label-caps uppercase py-5 mt-6 hover:bg-[#C5A059] transition-colors duration-300" type="submit">
                Log In
            </button>
</form>
<!-- Footer Links -->
<div class="mt-12 flex justify-center w-full">
<p class="font-label-caps text-label-caps text-on-surface-variant uppercase flex gap-4 items-center">
                New to Vango? 
                <a class="text-primary hover:text-[#C5A059] underline underline-offset-4 transition-colors font-bold" href="register.html">Create Account</a>
</p>
</div>
</main>
</body></html>
