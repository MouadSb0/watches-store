<body class="flex flex-col min-h-screen">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-on-background fixed top-0 w-full z-50 border-b border-outline dark:border-on-surface-variant">
<div class="flex items-center justify-between px-margin-mobile md:px-margin-desktop h-16 w-full max-w-container-max mx-auto">
<!-- Leading Action -->
<button aria-label="Go back" class="cursor-pointer active:scale-95 text-primary dark:text-on-primary hover:opacity-70 transition-opacity duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<!-- Brand Logo -->
<div class="text-center flex-grow">
<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-surface-bright tracking-[0.2em] uppercase">
                    VANGO
                </h1>
</div>
<!-- Trailing Action (Empty space to balance the header) -->
<div class="w-6"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center pt-24 pb-section-padding px-margin-mobile md:px-margin-desktop w-full max-w-container-max mx-auto">
<div class="w-full max-w-[480px] flex flex-col gap-12">
<!-- Header Section -->
<div class="flex flex-col gap-4 text-center md:text-left">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">NEW PASSWORD</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Create a secure new password for your VANGO account.</p>
</div>
<!-- Form Section -->
<form action="#" class="flex flex-col gap-8 w-full" method="POST">
<!-- Input Group: New Password -->
<div class="relative w-full group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="new-password">NEW PASSWORD</label>
<input class="w-full bg-transparent border-0 border-b border-primary text-primary font-body-lg text-body-lg p-0 py-2 placeholder-on-surface-variant/50 focus:border-b-2 transition-colors duration-200" id="new-password" name="new-password" placeholder="Enter new password" required="" type="password"/>
<button class="absolute right-0 bottom-2 text-on-surface-variant hover:text-primary transition-colors cursor-pointer" onclick="togglePassword('new-password')" type="button">
<span class="material-symbols-outlined text-[20px]" id="icon-new-password">visibility</span>
</button>
</div>
<!-- Input Group: Confirm Password -->
<div class="relative w-full group">
<label class="block font-label-caps text-label-caps text-on-surface-variant mb-2" for="confirm-password">CONFIRM PASSWORD</label>
<input class="w-full bg-transparent border-0 border-b border-primary text-primary font-body-lg text-body-lg p-0 py-2 placeholder-on-surface-variant/50 focus:border-b-2 transition-colors duration-200" id="confirm-password" name="confirm-password" placeholder="Confirm new password" required="" type="password"/>
<button class="absolute right-0 bottom-2 text-on-surface-variant hover:text-primary transition-colors cursor-pointer" onclick="togglePassword('confirm-password')" type="button">
<span class="material-symbols-outlined text-[20px]" id="icon-confirm-password">visibility</span>
</button>
</div>
<!-- Password Requirements Checklist -->
<div class="flex flex-col gap-2 mt-2">
<p class="font-label-caps text-label-caps text-on-surface-variant">PASSWORD MUST CONTAIN:</p>
<ul class="flex flex-col gap-1">
<li class="flex items-center gap-2 font-body-md text-[14px] text-on-surface-variant" id="req-length">
<span class="material-symbols-outlined text-[16px]">check_circle</span> 8+ characters
                        </li>
<li class="flex items-center gap-2 font-body-md text-[14px] text-on-surface-variant" id="req-uppercase">
<span class="material-symbols-outlined text-[16px]">check_circle</span> One uppercase letter
                        </li>
<li class="flex items-center gap-2 font-body-md text-[14px] text-on-surface-variant" id="req-number">
<span class="material-symbols-outlined text-[16px]">check_circle</span> One number
                        </li>
</ul>
</div>
<!-- Action Button -->
<button class="w-full flex items-center justify-between bg-primary text-on-primary font-label-caps text-label-caps px-6 py-4 hover:bg-[#C5A059] transition-colors duration-300 mt-4 cursor-pointer" type="submit">
<span>UPDATE PASSWORD</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>

<!-- Interactive Scripts -->
<script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById('icon-' + inputId);
            if (input.type === "password") {
                input.type = "text";
                icon.textContent = "visibility_off";
            } else {
                input.type = "password";
                icon.textContent = "visibility";
            }
        }
        
        // Simple client-side validation styling for the checklist
        const newPasswordInput = document.getElementById('new-password');
        
        newPasswordInput.addEventListener('input', function() {
            const val = this.value;
            
            const reqLength = document.getElementById('req-length');
            const reqUppercase = document.getElementById('req-uppercase');
            const reqNumber = document.getElementById('req-number');
            
            // Length
            if (val.length >= 8) {
                reqLength.classList.remove('text-on-surface-variant');
                reqLength.classList.add('text-[#000000]');
                reqLength.querySelector('span').classList.add('text-[#C5A059]');
                reqLength.querySelector('span').style.fontVariationSettings = "'FILL' 1";
            } else {
                reqLength.classList.add('text-on-surface-variant');
                reqLength.classList.remove('text-[#000000]');
                reqLength.querySelector('span').classList.remove('text-[#C5A059]');
                reqLength.querySelector('span').style.fontVariationSettings = "'FILL' 0";
            }
            
            // Uppercase
            if (/[A-Z]/.test(val)) {
                reqUppercase.classList.remove('text-on-surface-variant');
                reqUppercase.classList.add('text-[#000000]');
                reqUppercase.querySelector('span').classList.add('text-[#C5A059]');
                reqUppercase.querySelector('span').style.fontVariationSettings = "'FILL' 1";
            } else {
                reqUppercase.classList.add('text-on-surface-variant');
                reqUppercase.classList.remove('text-[#000000]');
                reqUppercase.querySelector('span').classList.remove('text-[#C5A059]');
                reqUppercase.querySelector('span').style.fontVariationSettings = "'FILL' 0";
            }
            
            // Number
            if (/[0-9]/.test(val)) {
                reqNumber.classList.remove('text-on-surface-variant');
                reqNumber.classList.add('text-[#000000]');
                reqNumber.querySelector('span').classList.add('text-[#C5A059]');
                reqNumber.querySelector('span').style.fontVariationSettings = "'FILL' 1";
            } else {
                reqNumber.classList.add('text-on-surface-variant');
                reqNumber.classList.remove('text-[#000000]');
                reqNumber.querySelector('span').classList.remove('text-[#C5A059]');
                reqNumber.querySelector('span').style.fontVariationSettings = "'FILL' 0";
            }
        });
    </script>
