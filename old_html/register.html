<style>
        /* Minimalist Input Styles */
        .input-minimal {
            background-color: transparent;
            border: none;
            border-bottom: 1px solid #1a1a1c;
            border-radius: 0;
            padding: 0.75rem 0;
            width: 100%;
            transition: border-color 0.3s ease;
        }
        .input-minimal:focus {
            outline: none;
            border-bottom-color: #775a19; /* Secondary/Gold accent */
            box-shadow: none;
        }
        
        /* Custom Checkbox */
        .checkbox-minimal {
            appearance: none;
            width: 16px;
            height: 16px;
            border: 1px solid #1a1a1c;
            border-radius: 0;
            display: grid;
            place-content: center;
            cursor: pointer;
        }
        .checkbox-minimal::before {
            content: "";
            width: 10px;
            height: 10px;
            background-color: #1a1a1c;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
        }
        .checkbox-minimal:checked::before {
            transform: scale(1);
        }
    </style>

    body {

<body class="bg-background text-on-background min-h-screen flex flex-col md:flex-row antialiased selection:bg-secondary selection:text-on-secondary">
<!-- Left side: Imagery / Brand Vibe (Desktop only) -->
<div class="hidden md:block md:w-1/2 relative bg-surface-container-high border-r border-primary">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A striking, close-up photograph of a luxury mechanical watch movement, focusing on the intricate gears, rubies, and polished steel components. The lighting is dramatic and directional, highlighting the brushed textures and creating deep, contrasting shadows. The overall aesthetic is highly technical, precise, and sophisticated, reflecting high-end horology. Colors are predominantly cool greys, silver, and deep black, with small bright red ruby accents." style="background-image: url('imgs/bg_register.webp')"></div>
<div class="absolute inset-0 bg-primary/10"></div> <!-- Subtle overlay -->
</div>
<!-- Right side: Registration Form -->
<div class="w-full md:w-1/2 min-h-screen flex flex-col justify-center px-margin-mobile py-section-padding md:px-margin-desktop bg-background">
<div class="max-w-[480px] w-full mx-auto">
<!-- Logo Header -->
<header class="mb-16 text-center">
<img src="imgs/logo_bg.jpg" alt="Logo" class="h-24 mx-auto mb-4">
<p class="font-headline-md text-headline-md text-on-surface-variant font-light">Join the Legacy</p>
</header>
<!-- Form -->
<form action="#" class="space-y-8 flex flex-col gap-gutter" method="POST">
<div class="grid grid-cols-1 md:grid-cols-2 gap-gutter">
<!-- First Name -->
<div class="relative pt-6">
<label class="absolute top-0 left-0 font-label-caps text-label-caps text-on-surface-variant uppercase pointer-events-none" for="first_name">First Name</label>
<input class="input-minimal font-body-md text-body-md text-on-background placeholder-outline-variant" id="first_name" name="first_name" placeholder="" required="" type="text"/>
</div>
<!-- Last Name -->
<div class="relative pt-6">
<label class="absolute top-0 left-0 font-label-caps text-label-caps text-on-surface-variant uppercase pointer-events-none" for="last_name">Last Name</label>
<input class="input-minimal font-body-md text-body-md text-on-background placeholder-outline-variant" id="last_name" name="last_name" placeholder="" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="relative pt-6">
<label class="absolute top-0 left-0 font-label-caps text-label-caps text-on-surface-variant uppercase pointer-events-none" for="email">Email Address</label>
<input class="input-minimal font-body-md text-body-md text-on-background placeholder-outline-variant" id="email" name="email" placeholder="" required="" type="email"/>
</div>
<!-- Password -->
<div class="relative pt-6">
<label class="absolute top-0 left-0 font-label-caps text-label-caps text-on-surface-variant uppercase pointer-events-none" for="password">Password</label>
<input class="input-minimal font-body-md text-body-md text-on-background placeholder-outline-variant" id="password" name="password" placeholder="" required="" type="password"/>
</div>
<!-- Newsletter Checkbox -->
<div class="flex items-start gap-4 pt-4">
<div class="flex items-center h-6">
<input class="checkbox-minimal" id="newsletter" name="newsletter" type="checkbox"/>
</div>
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="newsletter">
                        Subscribe to the Journal to receive exclusive updates, editorial content, and early access to new collections.
                    </label>
</div>
<!-- Submit Button -->
<div class="pt-8">
<button class="w-full bg-primary hover:bg-secondary text-on-primary font-label-caps text-label-caps py-5 px-8 uppercase tracking-widest transition-colors duration-300 flex justify-center items-center gap-2" type="submit">
                        Create Account
                        <span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</form>
<!-- Login Link -->
<div class="mt-12 text-center border-t border-primary-fixed-dim pt-8">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already a member? 
                    <a class="font-label-caps text-label-caps text-primary uppercase tracking-widest ml-2 border-b border-primary hover:text-secondary hover:border-secondary transition-colors duration-300 pb-1" href="login.html">Sign In</a>
</p>
</div>
</div>
</div>
